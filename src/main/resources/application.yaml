spring:

  http:
    clients:
      connect-timeout: 7s
      read-timeout: 15s
  datasource:
    hikari:
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration




  profiles:
    active:
      - ${ACTIVE_PROFILE:dev}

app:
  upload-dir: uploads
  public-url: ${PUBLIC_URL:localhost:9091/}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:*}

  mail:
    from: no-reply@ecommercewebsite
    base-url: ${APP_BASE_URL:https://ecommercewebsite.ir}

zarinpal:
  merchant-id: ${MERCHANT_ID:a1b2c3d4-e5f6-7890-abcd-ef1234567890}
  callback-url: ${CALLBACK_URL:https://yoursite.com/api/payments/callback}

springdoc:
  swagger-ui:
    with-credentials: true


