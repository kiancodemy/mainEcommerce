spring:
  datasource:
    hikari:
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  upload-dir: uploads
  public-url: ${PUBLIC_URL:localhost:9091/}

  mail:
    from: no-reply@ecommercewebsite
    base-url: ${APP_BASE_URL:https://ecommercewebsite.ir}

